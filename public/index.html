<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Dot Game - Clean Edition">
    <title>The Dot Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen" class="screen active">
        <div class="glass-panel">
            <h1>The Dot Game</h1>
            <p>Insira seu nome e sobrenome para começar.</p>
            <input type="text" id="username" placeholder="Nome e Sobrenome" autocomplete="off">
            <button id="login-btn">Iniciar Jogo</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <canvas id="l4-canvas" class="hidden"></canvas>
        <div id="level-indicator">Level 1</div>
        <div id="dot"></div>
        <div id="cups-container" class="hidden">
            <div class="cup" id="cup-0" data-index="0"></div>
            <div class="cup" id="cup-1" data-index="1"></div>
            <div class="cup" id="cup-2" data-index="2"></div>
        </div>
        <div id="victory-screen" class="hidden">
            <div class="glass-panel">
                <h1>Vitória!</h1>
                <p>Você completou todos os níveis com maestria.</p>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
